# SonarQube analysis, run with `make sonar` on the maintainer's machine. The server's
# address and the token are not here: SONAR_HOST_URL and SONAR_TOKEN come from the
# environment or a git-ignored .env. See CONTRIBUTING.md.
sonar.projectKey=drone-swarm-sim
sonar.projectName=drone-swarm-sim
sonar.sourceEncoding=UTF-8

# The code. Tests live next to it, so they are kept out of the sources by exclusion and
# picked up again as tests.
sonar.sources=cmd,internal
sonar.tests=cmd,internal
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go

# Written by `make sonar`.
sonar.go.coverage.reportPaths=coverage.out
# golangci-lint's findings (.golangci.yml), imported as external issues.
sonar.go.golangci-lint.reportPaths=golangci-lint.xml

# Cognitive complexity is not a test's measure: a table of cases reads as one function.
sonar.issue.ignore.multicriteria=testComplexity
sonar.issue.ignore.multicriteria.testComplexity.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.testComplexity.resourceKey=**/*_test.go
