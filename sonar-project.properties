# SonarQube analysis, run with `make sonar`. Host and token come from
# SONAR_HOST_URL and SONAR_TOKEN (.env), never from this file.
sonar.projectKey=drone-swarm-sim
sonar.projectName=drone-swarm-sim
sonar.sourceEncoding=UTF-8

sonar.sources=cmd,internal
sonar.exclusions=**/*_test.go
sonar.tests=cmd,internal
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out

sonar.go.golangci-lint.reportPaths=golangci-lint.xml
